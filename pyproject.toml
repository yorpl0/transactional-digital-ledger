[project]
name = "transactional-ledger"
version = "0.1.0"
description = "Minimal double-entry ledger with retry-safe, concurrent transfers"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "psycopg[binary,pool]==3.2.9",
  "pydantic-settings==2.10.1",
  "uvicorn[standard]==0.35.0",
]

[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

