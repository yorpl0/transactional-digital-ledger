services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports: ["5432:5432"]
    volumes:
      - ledger-data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://ledger:ledger@db:5432/ledger
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python -m app.migrate && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports: ["8000:8000"]

volumes:
  ledger-data:

